spring:
  application:
    name: ae-sports-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://dpg-d60adbsr85hc73esusqg-a.virginia-postgres.render.com:5432/ae_sports}
    username: ${DB_USERNAME:ae_sports_user}
    password: ${DB_PASSWORD:K3eQKSS8BImPnzSRWak1PKEVsYaFaFNy}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: HikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      initialization-fail-timeout: 0

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
